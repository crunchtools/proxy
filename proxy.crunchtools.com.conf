# SSL Configuration - bind to specific IP for CloudFlare sites
Listen *:443 https
Listen *:8443 https

SSLPassPhraseDialog exec:/usr/libexec/httpd-ssl-pass-dialog
SSLSessionCache shmcb:/run/httpd/sslcache(512000)
SSLSessionCacheTimeout 300
SSLRandomSeed startup file:/dev/urandom 256
SSLRandomSeed connect builtin
SSLCryptoDevice builtin

# --- MPM event tuning (added 2026-05-25 after worker-exhaustion outage) ---
# Root cause: mod_proxy's default backend connection reuse left stale pooled
# connections that the backends closed, accumulating as CLOSE_WAIT over months
# until MaxRequestWorkers (default 400) was hit and httpd stopped accept()ing.
# Recycle worker processes periodically and add headroom so a slow connection
# leak can no longer wedge the whole proxy. Pairs with disablereuse=On below.
<IfModule mpm_event_module>
    StartServers             3
    MinSpareThreads          75
    MaxSpareThreads          250
    ThreadsPerChild          25
    ServerLimit              32
    MaxRequestWorkers        800
    MaxConnectionsPerChild   10000
</IfModule>

# Local-only status endpoint so Nagios can watch worker saturation BEFORE the
# ceiling is hit (this outage was visible in logs for ~2 days before discovery).
ExtendedStatus On

# Global Security Headers (apply to all VirtualHosts)
# Using SAMEORIGIN for X-Frame-Options (some apps use iframes)
# Skipping Referrer-Policy globally (can break CSRF on some apps)
Header always set X-Frame-Options "SAMEORIGIN"
Header always set X-Content-Type-Options "nosniff"
Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

# Default VirtualHost (catch-all for unrecognized hosts)
<VirtualHost *:443>
    ServerName localhost
    
    SSLEngine on
    SSLCertificateFile /etc/httpd/certs/crunchtools.com.crt
    SSLCertificateKeyFile /etc/httpd/certs/crunchtools.com.key
    
    <Location />
        Require all denied
    </Location>

    # Worker/scoreboard metrics — localhost only (Nagios scrapes via --resolve)
    <Location /server-status>
        SetHandler server-status
        Require ip 127.0.0.1
        Require ip ::1
    </Location>
</VirtualHost>

# educatedconfusion.com -> 127.0.0.1:8081
<VirtualHost *:443>
    ServerName educatedconfusion.com
    ServerAlias www.educatedconfusion.com
    
    SSLEngine on
    SSLCertificateFile /etc/httpd/certs/educatedconfusion.com.crt
    SSLCertificateKeyFile /etc/httpd/certs/educatedconfusion.com.key
    
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8081/ disablereuse=On
    ProxyPassReverse / http://127.0.0.1:8081/
    
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
</VirtualHost>

# acquacotta.crunchtools.com -> 127.0.0.1:8080
<VirtualHost *:443>
    ServerName acquacotta.crunchtools.com

    SSLEngine on
    SSLCertificateFile /etc/httpd/certs/crunchtools.com.crt
    SSLCertificateKeyFile /etc/httpd/certs/crunchtools.com.key

    # Acquacotta-specific security headers
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' cdn.jsdelivr.net; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'self'; frame-ancestors 'none'; form-action 'self' https://accounts.google.com"

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8080/ disablereuse=On
    ProxyPassReverse / http://127.0.0.1:8080/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
</VirtualHost>

# acquacotta.crunchtools.com:8443 -> redirect to 443
<VirtualHost *:8443>
    ServerName acquacotta.crunchtools.com

    SSLEngine on
    SSLCertificateFile /etc/httpd/certs/crunchtools.com.crt
    SSLCertificateKeyFile /etc/httpd/certs/crunchtools.com.key

    Redirect permanent / https://acquacotta.crunchtools.com/
</VirtualHost>

# rootsofthevalley.org -> 127.0.0.1:8082
<VirtualHost *:443>
    ServerName rootsofthevalley.org
    ServerAlias www.rootsofthevalley.org
    
    SSLEngine on
    SSLCertificateFile /etc/httpd/certs/rootsofthevalley.org.crt
    SSLCertificateKeyFile /etc/httpd/certs/rootsofthevalley.org.key
    
    ProxyPreserveHost On
    
    # MCP admin server (Streamable HTTP — mounted on main Express app)
    ProxyPass /mcp http://127.0.0.1:8082/mcp
    ProxyPassReverse /mcp http://127.0.0.1:8082/mcp
    SetEnv proxy-nokeepalive 0
    SetEnv proxy-sendchunked 1
    SetEnv proxy-sendcl 0
    ProxyTimeout 3600
    
    # Main app
    ProxyPass / http://127.0.0.1:8082/
    ProxyPassReverse / http://127.0.0.1:8082/
    
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
</VirtualHost>

