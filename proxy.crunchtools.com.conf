# memory.crunchtools.com -> 127.0.0.1:8765 (MCP Memory Streamable HTTP + OAuth)
<VirtualHost *:443>
    ServerName memory.crunchtools.com

    SSLEngine on
    SSLCertificateFile /etc/httpd/certs/crunchtools.com.crt
    SSLCertificateKeyFile /etc/httpd/certs/crunchtools.com.key

    # Disable buffering for Streamable HTTP (SSE streams in responses)
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8765/
    ProxyPassReverse / http://127.0.0.1:8765/

    # Disable proxy buffering for streaming responses
    SetEnv proxy-nokeepalive 0
    SetEnv proxy-sendchunked 1
    SetEnv proxy-sendcl 0

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Extended timeouts for long-lived MCP connections
    ProxyTimeout 3600
    Timeout 3600
</VirtualHost>

