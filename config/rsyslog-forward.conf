# Forward this container's internal journal to syslog.crunchtools.com.
#
# Constitution XIII. PID 1 here is systemd, so conmon only captures systemd's
# own console output — httpd's error_log and access_log go to this container's
# private journal, which dies with the container and never reaches the host
# journal the central collector reads.
#
# proxy is built on ubi10-init directly rather than on ubi10-core, so it does not
# inherit the forwarding drop-in that ubi10-core provides. This is that drop-in,
# with one difference: the target.
#
# proxy runs with --network=host, so it reaches the collector on the loopback
# publish at 127.0.0.1:514. The ubi10-core copy targets 10.88.0.1 because the
# containers using it sit on the podman bridge.
#
# Loads no modules and sets no globals: the stock /etc/rsyslog.conf already
# declares imjournal and workDirectory, and rsyslog rejects the ENTIRE
# configuration on a duplicate — which would leave this container with no
# logging at all.

# proxy runs with --network=host, so its hostname IS lotor's. Without an override
# every line would be filed under lotor.dc3.crunchtools.com and be
# indistinguishable from the host's own logs — the collector keys network
# messages on the sender hostname. Name it explicitly so proxy's httpd logs land
# under proxy.crunchtools.com like every other service.
$LocalHostName proxy.crunchtools.com
$PreserveFQDN on

# resumeRetryCount=-1 with a disk-assisted queue means a collector restart backs
# logs up here instead of dropping them, and saveOnShutdown carries the backlog
# across a container restart. maxDiskSpace bounds the damage if the collector
# stays down for a long time.
action(type="omfwd"
       target="127.0.0.1"
       port="514"
       protocol="tcp"
       action.resumeRetryCount="-1"
       action.resumeInterval="10"
       queue.type="linkedList"
       queue.filename="fwd_collector"
       queue.maxDiskSpace="64m"
       queue.saveOnShutdown="on")
