name: Container
on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  schedule:
    - cron: "17 5 * * 1"
  repository_dispatch:
    types: [parent-image-updated]
  workflow_dispatch:
permissions: {}
jobs:
  container:
    uses: crunchtools/constitution/.github/workflows/container-release.yml@v1.40.0
    permissions:
      contents: read
      pull-requests: read
    with:
      image: quay.io/crunchtools/proxy
      default-branch: master
      boot: systemd
      boot-units: httpd.service
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
